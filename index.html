<meta name="description" content="Some people just make a place a little brighter.">

<style>
   :root {
     color-scheme: dark;
     --ink: #eee9df;
     --muted: #aaa99b;
     --accent: #d5bc80;
     --wire: #505248;
     --ease: cubic-bezier(.22, 1, .36, 1);
   }
   *, *::before, *::after { box-sizing: border-box; }
   html { min-height: 100%; background: #10120f; }
   body {
     margin: 0;
     min-width: 280px;
     min-height: 100vh;
     min-height: 100svh;
     color: var(--ink);
     font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
     -webkit-font-smoothing: antialiased;
     -webkit-tap-highlight-color: transparent;
   }
body.is-lit {
     color-scheme: light;
     --ink: #373022;
     --muted: #776b54;
     --accent: #9d712d;
     --wire: #665943;
   }
   .scene, .scene > * { position: fixed; inset: 0; pointer-events: none; }
   .scene { z-index: 0; overflow: hidden; background: #10120f; }
   .photo {
     width: 100%;
     height: 100%;
     object-fit: cover;
     object-position: 50% 46%;
     filter: saturate(.5);
   }
   .night {
     background:
       radial-gradient(ellipse at 50% 28%, transparent 5%, rgba(10, 13, 10, .28) 100%),
       linear-gradient(180deg, rgba(9, 12, 10, .91), rgba(9, 12, 10, .85) 50%, #10120f 100%);
     opacity: 1;
     transition: opacity 1.8s var(--ease);
   }
   .day {
     background:
       radial-gradient(ellipse at 50% 58%, rgba(250, 240, 219, .45) 0, transparent 65%),
       linear-gradient(180deg, rgba(242, 225, 188, .78), rgba(249, 236, 207, .65) 38%, rgba(248, 238, 216, .95) 77%, #f4ead7 100%);
     opacity: 0;
     transition: opacity 1.8s var(--ease);
   }
   .room-glow {
     background: radial-gradient(ellipse at 50% 24%, rgba(255, 209, 99, .36), transparent 64%);
     opacity: 0;
     transition: opacity 1.9s var(--ease);
   }
   .is-lit .night { opacity: 0; }
   .is-lit .day, .is-lit .room-glow { opacity: 1; }
   .experience {
     position: relative;
     z-index: 1;
     isolation: isolate;
     display: flex;
     flex-direction: column;
     align-items: center;
     min-height: 100vh;
     min-height: 100svh;
     padding: 0 24px max(100px, env(safe-area-inset-bottom));
     text-align: center;
   }
   .lamp-area {
     position: relative;
     flex: none;
     width: 180px;
     margin-top: 0;
   }
   .lamp-button {
     position: relative;
     display: block;
     width: 180px;
     height: clamp(210px, 40vh, 360px);
     height: clamp(210px, 40svh, 360px);
     margin: 0;
     padding: 0;
     border: 0;
     outline: none;
     background: transparent;
     color: inherit;
     cursor: pointer;
     touch-action: manipulation;
   }
   .lamp-button:focus-visible::after {
     content: "";
     position: absolute;
     left: 50%;
     bottom: 8%;
     width: 100px;
     height: 118px;
     border: 2px solid var(--accent);
     border-radius: 50%;
     transform: translateX(-50%);
   }
   .lamp-swing {
     position: absolute;
     inset: 0;
     transform-origin: 50% 0;
     animation: sway 6s ease-in-out infinite;
   }
   .is-lit .lamp-swing { animation-play-state: paused; }
   .lamp-svg { width: 100%; height: 100%; overflow: visible; }
   .cable { stroke: var(--wire); transition: stroke 1.5s ease; }
   .glass-off { opacity: 1; transition: opacity 1.2s ease; }
   .glass-on, .filament-on, .bulb-halo { opacity: 0; transition: opacity 1.5s var(--ease); }
   .is-lit .glass-off { opacity: 0; }
   .is-lit .glass-on, .is-lit .filament-on, .is-lit .bulb-halo { opacity: 1; }
   .filament-off { opacity: .5; transition: opacity 1s ease; }
   .is-lit .filament-off { opacity: 0; }
   .hint {
     position: relative;
     margin: -9px 0 0;
     color: var(--muted);
     font-size: 10px;
     font-weight: 400;
     letter-spacing: .16em;
     line-height: 1.6;
     text-transform: uppercase;
     transition: color 1.3s ease, opacity .5s ease;
   }
   .hint::before {
     content: "";
     display: block;
     width: 1px;
     height: 19px;
     margin: 0 auto 12px;
     background: currentColor;
     opacity: .35;
   }
   .is-lit .hint { opacity: .75; }
   .copy { width: 100%; max-width: 760px; margin-top: 27px; }
   .heading {
     position: relative;
     margin: 0;
     font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
     font-size: clamp(50px, 7.1vw, 92px);
     font-weight: 400;
     letter-spacing: -.045em;
     line-height: 1.05;
     transition: color 1.3s ease;
   }
   .heading-first { display: block; }
   .heading-second {
     position: relative;
     display: grid;
     margin-top: 4px;
     font-style: italic;
   }
   .heading-second > span { grid-area: 1 / 1; }
   .without {
     opacity: 1;
     transform: translateY(0);
     transition: opacity .55s ease .12s, transform .9s var(--ease);
   }
   .with {
     color: #8b6024;
     opacity: 0;
     transform: translateY(16px);
     transition: opacity .6s ease, transform .9s var(--ease);
   }
   .is-lit .without { opacity: 0; transform: translateY(-16px); transition-delay: 0s; }
   .is-lit .with { opacity: 1; transform: translateY(0); transition-delay: .35s; }
   .sparkle {
     display: inline-block;
     width: .27em;
     height: .35em;
     margin-left: .12em;
     vertical-align: .28em;
     overflow: visible;
   }
   .message {
     position: relative;
     margin: 25px auto 0;
     color: var(--muted);
     font-size: clamp(14px, 1.25vw, 16px);
     font-weight: 400;
     letter-spacing: .015em;
     line-height: 1.85;
     opacity: 0;
     transform: translateY(10px);
     visibility: hidden;
     transition: opacity .45s ease, transform .7s var(--ease), visibility .45s;
   }
   .message span { display: block; }
   .message .name { color: #51432d; font-weight: 500; }
   .is-lit .message {
     opacity: 1;
     visibility: visible;
     transform: translateY(0);
     transition-delay: .75s;
   }
   .signature {
     position: absolute;
     bottom: max(28px, env(safe-area-inset-bottom));
     left: 24px;
     right: 24px;
     display: flex;
     align-items: center;
     justify-content: center;
     gap: 10px;
     margin: 0;
     color: var(--muted);
     font-size: 9px;
     letter-spacing: .19em;
     line-height: 1.6;
     text-transform: uppercase;
     transition: color 1.4s ease;
   }
   .signature::before, .signature::after {
     content: "";
     width: 18px;
     height: 1px;
     background: currentColor;
     opacity: .45;
   }
   .sr-only {
     position: absolute;
     width: 1px;
     height: 1px;
     padding: 0;
     margin: -1px;
     overflow: hidden;
     clip: rect(0, 0, 0, 0);
     white-space: nowrap;
     border: 0;
   }
   noscript { display: block; margin: 20px; color: #eee9df; font-size: 14px; text-align: center; }
   @keyframes sway {
     0%, 100% { transform: rotate(-1.6deg); }
     50% { transform: rotate(1.6deg); }
   }
   @media (min-width: 1500px) {
     .photo { object-position: 50% 50%; }
   }
   @media (max-width: 600px) {
     .experience { padding-left: 18px; padding-right: 18px; }
     .photo { object-position: 55% 50%; }
     .copy { margin-top: 29px; }
     .heading { font-size: clamp(44px, 11.4vw, 65px); }
     .message { margin-top: 24px; }
     .signature { font-size: 8px; letter-spacing: .16em; }
   }
   @media (max-height: 650px) {
     .lamp-button { height: 210px; }
     .copy { margin-top: 20px; }
     .heading { font-size: clamp(42px, 8vw, 60px); }
     .message { margin-top: 18px; }
     .experience { padding-bottom: 78px; }
     .signature { bottom: max(20px, env(safe-area-inset-bottom)); }
   }
   @media (prefers-reduced-motion: reduce) {
     *, *::before, *::after {
       animation: none !important;
       transition-duration: .01ms !important;
       transition-delay: 0s !important;
     }
   }
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
<img class="photo" src="./assets/gym.jpg" alt="" width="796" height="660" fetchpriority="high">
<div class="night"></div>
<div class="day"></div>
<div class="room-glow"></div>
</div>
<main class="experience">
<div class="lamp-area">
<button class="lamp-button" id="lamp" type="button" aria-label="Turn on the light" aria-pressed="false" aria-describedby="lamp-hint">
<span class="lamp-swing" aria-hidden="true">
<svg class="lamp-svg" viewBox="0 0 180 360" preserveAspectRatio="xMidYMin meet" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialGradient id="halo">
<stop offset="0" stop-color="#ffcf70" stop-opacity=".7"/>
<stop offset=".4" stop-color="#f8c15e" stop-opacity=".2"/>
<stop offset="1" stop-color="#ffc96a" stop-opacity="0"/>
</radialGradient>
<linearGradient id="socket" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#2a2a25"/>

<stop offset=".65" stop-color="#464437"/>

</linearGradient>

<stop offset="0" stop-color="#bac5b5" stop-opacity=".17"/>
<stop offset=".5" stop-color="#849581" stop-opacity=".04"/>
<stop offset="1" stop-color="#ced4bb" stop-opacity=".12"/>
</linearGradient>
<radialGradient id="glass-on" cx=".5" cy=".56" r=".65">
<stop offset="0" stop-color="#fff9d8"/>
<stop offset=".42" stop-color="#ffe6a0"/>
<stop offset="1" stop-color="#edb85d" stop-opacity=".85"/>
</radialGradient>

<feGaussianBlur stdDeviation="2.4"/>

<rect x="82" y="201" width="16" height="13" rx="3" fill="#34372d"/>

</g>

<path class="glass-on" d="M77 242C77 253 57 258 57 280C57 303 70 321 90 321S123 303 123 280C123 258 103 253 103 242Z" fill="url(#glass-on)" stroke="#fff0be" stroke-width="1"/>

</g>

</svg>
</span>
</button>
<p class="hint" id="lamp-hint">tap to turn on</p>
</div>
<section class="copy" aria-label="A little note for Myriam">
<h1 class="heading" id="heading" aria-label="The gym without you…">
<span class="heading-first" aria-hidden="true">The gym</span>
<span class="heading-second" aria-hidden="true">
<span class="without">without you…</span>
<span class="with">with you<svg class="sparkle" viewBox="0 0 32 42" aria-hidden="true"><path d="M16 1C16 17 13 21 1 21C13 21 16 25 16 41C16 25 19 21 31 21C19 21 16 17 16 1Z" fill="currentColor"/></svg></span>
</span>
</h1>
<p class="message" id="message" aria-hidden="true">
<span>Enjoy Vietnam, <span class="name" style="display: inline">Myriam.</span></span>
<span>You’re missed here.</span>
</p>
</section>
<p class="signature">Some people make a place brighter</p>
<p class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></p>
</main>
<noscript>Please enable JavaScript to turn on the light.</noscript>
<script>
   (() => {
     'use strict';
     const lamp = document.getElementById('lamp');
     const hint = document.getElementById('lamp-hint');
     const heading = document.getElementById('heading');
     const message = document.getElementById('message');
     const announcement = document.getElementById('announcement');
     const themeColor = document.getElementById('theme-color');
     let isLit = false;
     // A real button supports touch, mouse, Enter, and Space automatically.
     // The page always starts dark; no account, tracking, or saved state.
     lamp.addEventListener('click', () => {
       isLit = !isLit;
       document.body.classList.toggle('is-lit', isLit);
       lamp.setAttribute('aria-pressed', String(isLit));
       lamp.setAttribute('aria-label', isLit ? 'Turn off the light' : 'Turn on the light');
       hint.textContent = isLit ? 'tap to turn off' : 'tap to turn on';
       heading.setAttribute('aria-label', isLit ? 'The gym with you' : 'The gym without you…');
       message.setAttribute('aria-hidden', String(!isLit));
       themeColor.setAttribute('content', isLit ? '#f4ead7' : '#10120f');
       announcement.textContent = isLit
         ? 'The gym with you. Enjoy Vietnam, You’re missed here.'
         : 'The gym without you…';
     });
   })();
</script>
</body>
